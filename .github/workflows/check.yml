name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Test and smoke
        run: ./scripts/check.sh
      - name: Build container
        run: docker build -t storeshoppers:test .
      - name: Verify container isolation, health and persistence
        run: ./scripts/container-check.sh
